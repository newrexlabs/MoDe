[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "MoDe"
version = "0.1.0"
description = "MoDe: small mixture-of-experts models that answer typed decision questions with calibrated probabilities."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "torch>=2.8",
  "transformers==4.57.6",
  "safetensors>=0.4",
  "huggingface_hub>=0.30,<1.0",
]

[project.optional-dependencies]
eval = ["decision-index @ git+https://github.com/apolinario/decision-index"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/mode_decider"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 120
target-version = "py310"
